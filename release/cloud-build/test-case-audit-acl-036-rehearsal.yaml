steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker network create test-case-acl-036
        docker run -d --name test-case-acl-036-pg --network test-case-acl-036 \
          -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=sales_tools postgres:16-alpine
        until docker run --rm --network test-case-acl-036 postgres:16-alpine pg_isready -h test-case-acl-036-pg -U postgres -d sales_tools; do sleep 1; done
        docker run --rm --network test-case-acl-036 -e PGPASSWORD=postgres postgres:16-alpine \
          psql -h test-case-acl-036-pg -U postgres -d sales_tools -v ON_ERROR_STOP=1 \
          -c "CREATE ROLE sales_tools_migration LOGIN PASSWORD 'rehearsal-only';" \
          -c "CREATE ROLE sales_tools_app LOGIN PASSWORD 'app-only';" \
          -c "CREATE ROLE sales_tools_runtime;" \
          -c "GRANT ALL ON DATABASE sales_tools TO sales_tools_migration;" \
          -c "GRANT ALL ON SCHEMA public TO sales_tools_migration;" \
          -c "ALTER DEFAULT PRIVILEGES FOR ROLE sales_tools_migration IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sales_tools_app;"
        docker run --rm --network test-case-acl-036 -v /workspace:/workspace -w /workspace \
          -e PGHOST=test-case-acl-036-pg -e PGPORT=5432 -e RUN_TEST_CASE_AUDIT_ACL_PG=1 node:20-bookworm \
          bash -ceu "npm ci --no-audit --no-fund && node -r ts-node/register --test test/testCaseAuditAclReleasePackage.postgres.test.ts"
        docker rm -f test-case-acl-036-pg
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
