<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>業務KAIZEN案件一覧 | atLIB Sales Tools</title><link rel="stylesheet" href="/admin/partner-leads.css">
<style>.panel{background:#fff;border:1px solid #d9e1ea;border-radius:12px;padding:18px;margin-bottom:16px}.filters{display:grid;grid-template-columns:2fr 1.5fr 1fr 1.4fr auto;gap:10px;align-items:end}.field{display:grid;gap:5px}.field input,.field select{padding:10px;border:1px solid #9daaba;border-radius:8px;background:#fff;font:inherit}.button,button{display:inline-block;padding:10px 14px;border:0;border-radius:8px;background:#176b5b;color:#fff;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.button[hidden]{display:none}.button.secondary,button.secondary{background:#fff;color:#1f3556;border:1px solid #8fa0b2}.context{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.context div{background:#f3f7fa;padding:10px}.table-wrap{overflow-x:auto}table{width:100%;min-width:1040px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #d9e1ea;text-align:left;vertical-align:top}th{white-space:nowrap}.status{min-height:1.5em}.error{color:#a32626}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px}.muted{color:#667085}@media(max-width:760px){.filters,.context{grid-template-columns:1fr}.filters button{width:100%}.admin-shell{padding:18px 12px}.table-wrap{border:1px solid #d9e1ea;border-radius:8px}}</style></head>
<body><main class="admin-shell"><header class="admin-header"><div><p class="eyebrow">atLIB Sales Tools</p><h1>業務KAIZEN案件一覧</h1><p>Customer SelfとStaff ProxyのDiagnosis正本を表示します。</p></div><nav class="admin-nav"><a href="/admin/sales-customers.html">共通顧客管理</a></nav></header>
<section id="activity-context" class="panel" hidden><h2>選択中のSales Activity</h2><div id="activity-values" class="context"></div><p id="activity-status" class="status" role="status"></p><a id="proxy-start" class="button" hidden>この営業活動から代理入力を開始・再開</a></section>
<section class="panel"><form id="filters" class="filters"><label class="field">会社名<input id="company-name" maxlength="200"></label><label class="field">担当営業<input id="owner" maxlength="320"></label><label class="field">入力方法<select id="entry-channel"><option value="">すべて</option><option value="CUSTOMER_SELF">本人</option><option value="STAFF_PROXY">スタッフ代理</option></select></label><label class="field">営業Stage<select id="current-stage"><option value="">すべて</option><option>ACCEPTED</option><option>SCHEDULING</option><option>SCHEDULED</option><option>MEETING_COMPLETED</option><option>PROPOSAL_IN_PROGRESS</option><option>PROPOSED</option></select></label><button type="submit">検索</button></form></section>
<section class="panel"><p id="list-status" class="status" role="status"></p><div class="table-wrap"><table><thead><tr><th>会社名</th><th>担当者名</th><th>入力方法</th><th>診断結果</th><th>入力状態</th><th>営業Stage</th><th>担当営業</th><th>更新日時</th><th>操作</th></tr></thead><tbody id="diagnoses"></tbody></table></div><div class="pager"><button id="previous" type="button" class="secondary">前へ</button><span id="page-number">1ページ</span><button id="next" type="button" class="secondary">次へ</button></div></section>
</main><script>(()=>{'use strict';const api='/api/admin/business-kaizen',pageSize=20,byId=id=>document.getElementById(id);let page=1,loading=false;
async function request(url){const response=await fetch(url,{headers:{'Content-Type':'application/json'}}),body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'REQUEST_FAILED');return body}
function cell(row,value){const td=document.createElement('td');td.textContent=value===null||value===undefined||value===''?'—':String(value);row.append(td);return td}
function formatDate(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.valueOf())?'—':date.toLocaleString('ja-JP')}
function updatePager(hasNext){byId('previous').disabled=loading||page===1;byId('next').disabled=loading||!hasNext;byId('page-number').textContent=`${page}ページ`}
async function load(){if(loading)return;loading=true;const status=byId('list-status'),body=byId('diagnoses');status.className='status';status.textContent='読み込み中です…';body.replaceChildren();updatePager(false);const params=new URLSearchParams({page:String(page),limit:String(pageSize)});for(const [id,key] of [['company-name','companyName'],['owner','owner'],['entry-channel','entryChannel'],['current-stage','currentStage']]){const value=byId(id).value.trim();if(value)params.set(key,value)}try{const result=await request(`${api}/diagnoses?${params}`);for(const item of result.items){const row=document.createElement('tr');cell(row,item.companyName);cell(row,item.contactName);cell(row,item.entryChannel==='CUSTOMER_SELF'?'本人':'スタッフ代理');cell(row,item.direction||item.directionStatus||'未確定');cell(row,item.inputState==='DRAFT'?'下書き':'完了');cell(row,item.currentStage||'—');cell(row,item.ownerUserEmail||'未設定');cell(row,formatDate(item.updatedAt));const action=document.createElement('td'),link=document.createElement('a');link.className='button secondary';link.href=`/admin/business-kaizen-diagnosis-detail.html?id=${encodeURIComponent(item.diagnosisId)}`;link.textContent='詳細';action.append(link);row.append(action);body.append(row)}status.textContent=result.items.length?`${result.items.length}件を表示しています。`:'該当するDiagnosisはありません。';loading=false;updatePager(result.hasNext)}catch(error){status.className='status error';status.textContent=`一覧を読み込めませんでした: ${error.message}`;loading=false;updatePager(false)}}
byId('filters').addEventListener('submit',event=>{event.preventDefault();page=1;void load()});byId('previous').onclick=()=>{if(page>1){page--;void load()}};byId('next').onclick=()=>{page++;void load()};
async function loadActivity(){const id=new URLSearchParams(location.search).get('salesActivityId');if(!id)return;const panel=byId('activity-context'),status=byId('activity-status');panel.hidden=false;if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)){status.className='status error';status.textContent='Sales Activity IDが不正です。';return}try{const activity=await request(`/api/admin/sales-customers/activities/${encodeURIComponent(id)}`),values=byId('activity-values');values.replaceChildren();for(const [label,value] of [['企業',activity.companyName],['担当者',activity.contactName],['サービス',activity.selectedService]]){const box=document.createElement('div'),title=document.createElement('b'),text=document.createElement('p');title.textContent=label;text.textContent=String(value||'—');box.append(title,text);values.append(box)}if(activity.selectedService!=='BUSINESS_WEB'){status.className='status error';status.textContent='このSales Activityは業務KAIZENではありません。';return}status.textContent='業務KAIZENのSales Activityを確認しました。一覧表示だけではDiagnosisを作成しません。';const link=byId('proxy-start');link.href=`/admin/business-kaizen-proxy.html?salesActivityId=${encodeURIComponent(id)}`;link.hidden=false}catch(error){status.className='status error';status.textContent=`Sales Activityを確認できませんでした: ${error.message}`}}
void load();void loadActivity();})();</script></body></html>
