<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InfraVision Partner Leads</title></head><body><main><h1>InfraVision Partner Leads</h1><label>Status <select id="filter"><option value="">All</option><option value="schedule_pending">Pending</option><option value="scheduled">Scheduled</option><option value="meeting_completed">Completed</option><option value="partnered">Partnered</option><option value="lost">Lost</option></select></label><p id="msg">Loading…</p><table id="table" hidden><thead><tr><th>Created</th><th>Company</th><th>Contact</th><th>Email</th><th>Campaign</th><th>Scheduled</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></main><script>const endpoint='/api/admin/infravision-partner-leads',labels={schedule_pending:'Pending',scheduled:'Scheduled',meeting_completed:'Completed',partnered:'Partnered',lost:'Lost'};let items=[];const td=v=>{const e=document.createElement('td');e.textContent=v??'';return e};function draw(){const f=filter.value,rows=items.filter(x=>!f||x.status===f);body.replaceChildren();for(const x of rows){const tr=document.createElement('tr'),sel=document.createElement('select');sel.dataset.id=x.id;for(const [v,l] of Object.entries(labels)){const o=new Option(l,v);o.selected=v===x.status;sel.add(o)}sel.onchange=async()=>{sel.disabled=true;const r=await fetch(endpoint+'/'+encodeURIComponent(x.id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:sel.value})});sel.disabled=false;if(!r.ok){sel.value=x.status;alert('Update failed')}else{x.status=sel.value}};tr.append(td(new Date(x.created_at).toLocaleString()),td(x.company_name),td(x.contact_name),td(x.email),td((x.utm_source||'-')+' / '+(x.utm_campaign||'-')),td(x.scheduled_at?new Date(x.scheduled_at).toLocaleString():'-'),td(''));tr.lastChild.append(sel);body.append(tr)}msg.textContent=rows.length?'': 'No leads';table.hidden=!rows.length}async function load(){try{const r=await fetch(endpoint);if(!r.ok)throw Error();items=(await r.json()).items;draw()}catch{msg.textContent='Failed to load leads'}}filter.onchange=draw;load();</script></body></html>
