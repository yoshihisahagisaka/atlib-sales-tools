<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>InfraVision パートナーリード | atLIB Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/style.css"><style>.badge{padding:.2rem .5rem;border-radius:999px;font-size:.8rem;background:#eef2f6}.pending{background:#fff2df}.scheduled{background:#dcf7ef}.filters{display:flex;gap:1rem;align-items:end}.muted{color:#667085;font-size:.82rem}select{min-width:130px}</style></head><body><div class="page" style="max-width:1400px"><h1>InfraVision パートナーリード</h1><p class="muted">LP受付から日程調整、商談、協業化までを管理します。</p><div class="card"><div class="filters"><div class="form-row"><label for="filter">ステータス</label><select id="filter"><option value="">すべて</option><option value="schedule_pending">日程未調整</option><option value="scheduled">日程調整済</option><option value="meeting_completed">商談済</option><option value="partnered">協業化</option><option value="lost">見送り</option></select></div></div><div id="msg">読み込み中...</div><table id="table" style="display:none"><thead><tr><th>受付日時</th><th>会社名</th><th>担当者</th><th>連絡先</th><th>流入</th><th>予約日時</th><th>ステータス</th></tr></thead><tbody id="body"></tbody></table></div></div><script>
const labels={schedule_pending:'日程未調整',scheduled:'日程調整済',meeting_completed:'商談済',partnered:'協業化',lost:'見送り'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[];
function draw(){const f=document.getElementById('filter').value,b=document.getElementById('body');b.innerHTML='';const xs=items.filter(x=>!f||x.status===f);for(const x of xs){const tr=document.createElement('tr');tr.innerHTML='<td>'+esc(new Date(x.created_at).toLocaleString('ja-JP'))+'</td><td>'+esc(x.company_name)+'</td><td>'+esc(x.contact_name)+'</td><td><a href="mailto:'+encodeURIComponent(x.email)+'">'+esc(x.email)+'</a><br>'+esc(x.phone||'')+'</td><td>'+esc(x.utm_source||'-')+' / '+esc(x.utm_campaign||'-')+'</td><td>'+esc(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('ja-JP'):'-')+'</td><td><select data-id="'+esc(x.id)+'">'+Object.entries(labels).map(([v,l])=>'<option value="'+v+'" '+(v===x.status?'selected':'')+'>'+l+'</option>').join('')+'</select></td>';b.appendChild(tr)}document.getElementById('msg').textContent=xs.length?'':'該当するリードはありません。';document.getElementById('table').style.display=xs.length?'table':'none';document.querySelectorAll('select[data-id]').forEach(el=>el.addEventListener('change',async()=>{el.disabled=true;const r=await fetch('/api/admin/infravision-partner-leads/'+encodeURIComponent(el.dataset.id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:el.value})});el.disabled=false;if(!r.ok)alert('更新に失敗しました。');else{const x=items.find(i=>i.id===el.dataset.id);if(x)x.status=el.value}}))}
async function load(){try{const r=await fetch('/api/admin/infravision-partner-leads');if(!r.ok)throw 0;items=(await r.json()).items;draw()}catch{document.getElementById('msg').textContent='一覧の取得に失敗しました。'}}
document.getElementById('filter').addEventListener('change',draw);load();</script></body></html>
