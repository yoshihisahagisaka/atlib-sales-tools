<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InfraVision パートナーリード | atLIB Admin</title><link rel="stylesheet" href="/admin/partner-leads.css"></head>
<body><main class="admin-shell">
<header class="admin-header"><div><p class="eyebrow">atLIB Sales Tools</p><h1>InfraVision パートナーリード</h1><p class="subtitle">LP受付から日程調整、商談、協業化までを管理します。</p></div><nav class="admin-nav" aria-label="Partner lead navigation"><a href="/admin/infravision-partner-leads.html" aria-current="page">InfraVision</a><a href="/admin/web-development-partner-leads.html">Web Development</a></nav></header>
<section class="card"><div class="toolbar"><div class="field"><label for="filter">ステータス</label><select id="filter"><option value="">すべて</option><option value="schedule_pending">日程未調整</option><option value="scheduled">日程調整済</option><option value="meeting_completed">商談済</option><option value="partnered">協業化</option><option value="lost">見送り</option></select></div><div id="count" class="count"></div></div>
<div id="msg" class="loading">読み込み中...</div><div class="table-wrap"><table id="table" class="lead-table hidden"><thead><tr><th>受付日時</th><th>会社名</th><th>担当者</th><th>連絡先</th><th>流入</th><th>予約日時</th><th>ステータス</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main><script>
const endpoint='/api/admin/infravision-partner-leads',labels={schedule_pending:'日程未調整',scheduled:'日程調整済',meeting_completed:'商談済',partnered:'協業化',lost:'見送り'};let items=[];
const el=id=>document.getElementById(id);const td=(v,cls)=>{const e=document.createElement('td');e.textContent=v??'';if(cls)e.className=cls;return e};
function draw(){const f=el('filter').value,rows=items.filter(x=>!f||x.status===f),body=el('body');body.replaceChildren();for(const x of rows){const tr=document.createElement('tr');tr.append(td(new Date(x.created_at).toLocaleString('ja-JP')),td(x.company_name,'company'),td(x.contact_name));const contact=document.createElement('td'),mail=document.createElement('a');mail.href='mailto:'+x.email;mail.textContent=x.email;mail.className='contact-link';contact.append(mail);if(x.phone){contact.append(document.createElement('br'),document.createTextNode(x.phone))}tr.append(contact,td((x.utm_source||'-')+' / '+(x.utm_campaign||'-'),'campaign'),td(x.scheduled_at?new Date(x.scheduled_at).toLocaleString('ja-JP'):'-','muted'));const statusTd=document.createElement('td'),sel=document.createElement('select');sel.className='status-select';for(const [v,l] of Object.entries(labels)){const o=new Option(l,v);o.selected=v===x.status;sel.add(o)}sel.onchange=async()=>{const before=x.status;sel.disabled=true;try{const r=await fetch(endpoint+'/'+encodeURIComponent(x.id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:sel.value})});if(!r.ok)throw Error();x.status=sel.value}catch{sel.value=before;alert('ステータスの更新に失敗しました。')}finally{sel.disabled=false}};statusTd.append(sel);tr.append(statusTd);body.append(tr)}el('count').textContent=rows.length+'件';el('msg').textContent=rows.length?'':'該当するリードはありません。';el('msg').className=rows.length?'hidden':'empty';el('table').classList.toggle('hidden',!rows.length)}
async function load(){try{const r=await fetch(endpoint);if(!r.ok)throw Error();items=(await r.json()).items||[];draw()}catch{el('msg').textContent='一覧の取得に失敗しました。';el('msg').className='error'}}
el('filter').addEventListener('change',draw);load();
</script></body></html>
