<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIRA受付管理</title><style>body{font-family:sans-serif;margin:2rem;color:#1f3556}form,.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccd5df;padding:.5rem;text-align:left}th{background:#eef5f3}.badge{padding:.2rem .5rem;background:#e8f7f3}.warning{color:#9a4b00}dialog{max-width:50rem}button{padding:.45rem .8rem}</style></head><body><h1>PIRA受付管理</h1><p>診断回答・診断結果・PDFは保存・表示しません。</p><form id="filters"><select name="initiativeCode"><option value="">全施策</option></select><select name="initiativeKind"><option value="">全受付区分</option><option value="UNION">UNION</option><option value="GENERAL">GENERAL</option></select><select name="state"><option value="">全状態</option><option>RECEIVED</option><option>ANSWERING</option><option>COMPLETED</option></select><input name="companyName" placeholder="企業名"><input name="from" type="date"><input name="to" type="date"><button>検索</button></form><div class="toolbar"><button id="csv" type="button">CSV出力</button><button id="xlsx" type="button">XLSX出力</button><span id="export-note" class="warning"></span></div><p id="status"></p><table><thead><tr><th>受付日時</th><th>施策</th><th>状態</th><th>企業名</th><th>担当者</th><th>営業利用</th></tr></thead><tbody id="items"></tbody></table><dialog id="detail"><button id="close">閉じる</button><pre></pre></dialog><script src="app.js"></script></body></html>
