<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SECU Insight受付管理</title>
  <style>
    :root{color-scheme:light;--navy:#1f3556;--green:#2dbe9d;--line:#ccd5df;--soft:#f8fafc}
    *{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--soft);color:var(--navy)}
    main{max-width:1180px;margin:auto;padding:32px 24px}h1{margin:0 0 24px;font-size:2rem}form,.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0}
    select,input,button{font:inherit;padding:.55rem .75rem;border:1px solid var(--line);border-radius:7px;background:#fff}button{cursor:pointer}form button,.toolbar button{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:820px}th,td{border-bottom:1px solid var(--line);padding:.7rem;text-align:left}th{background:#eef5f3}tbody tr{cursor:pointer}tbody tr:hover,tbody tr:focus{background:#f0faf7}.warning{color:#9a4b00}
    dialog{width:min(760px,calc(100% - 32px));max-height:90vh;border:0;border-radius:12px;padding:0;box-shadow:0 18px 60px #10213a44}dialog::backdrop{background:#10213a88}.detail-head{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line)}.detail-head h2{margin:0;font-size:1.35rem}.detail-head button{margin-left:auto}.detail-body{padding:8px 24px 24px;overflow:auto}.detail-section{margin-top:20px}.detail-section h3{font-size:1rem;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--green)}dl{display:grid;grid-template-columns:minmax(145px,190px) 1fr;margin:0}dt,dd{padding:8px 4px;border-bottom:1px solid #e4e9ef}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}
    [hidden]{display:none!important}@media(max-width:680px){main{padding:20px 14px}h1{font-size:1.6rem}form>*{width:100%}dl{grid-template-columns:1fr}dt{padding-bottom:2px;border-bottom:0}dd{padding-top:2px}}
  </style>
</head>
<body><main>
  <h1>SECU Insight受付管理</h1>
  <form id="filters">
    <select name="initiativeCode" aria-label="施策"><option value="">全施策</option></select>
    <select name="initiativeKind" aria-label="受付区分"><option value="">全受付区分</option><option value="UNION">国連協</option><option value="GENERAL">一般向け</option></select>
    <select name="state" aria-label="診断状態"><option value="">全状態</option><option value="RECEIVED">受付済み</option><option value="ANSWERING">診断中</option><option value="COMPLETED">診断完了</option></select>
    <input name="companyName" placeholder="企業名" aria-label="企業名">
    <input name="from" type="date" aria-label="受付日（開始）"><input name="to" type="date" aria-label="受付日（終了）"><button>検索</button>
  </form>
  <div class="toolbar" id="export-toolbar" hidden><button id="csv" type="button">CSV出力</button><button id="xlsx" type="button">XLSX出力</button></div>
  <p id="status" aria-live="polite"></p>
  <div class="table-wrap"><table><thead><tr><th>受付日時</th><th>施策</th><th>受付区分</th><th>診断状態</th><th>企業名</th><th>担当者名</th><th>営業利用可否</th></tr></thead><tbody id="items"></tbody></table></div>
  <dialog id="detail"><header class="detail-head"><h2 id="detail-title"></h2><button id="close" type="button">閉じる</button></header><div class="detail-body" id="detail-body"></div></dialog>
  <script src="app.js"></script>
</main></body></html>
