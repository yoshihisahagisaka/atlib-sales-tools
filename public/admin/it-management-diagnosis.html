<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>無料 IT経営診断 案件一覧 | atLIB株式会社</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/it-management-diagnosis.css">
<script src="/js/it-management-diagnosis-admin.js" defer></script>
</head>
<body data-view="list">
<main class="page" style="max-width:1440px">
<h1>無料 IT経営診断 案件一覧</h1><p>提供：atLIB株式会社</p>
<p><a href="/admin/it-management-diagnosis-new.html">＋ 営業訪問の代理入力</a></p>
<section class="card">
<div class="diagnosis-filters">
<div class="form-row"><label for="status-filter">Diagnosis Status</label><select id="status-filter"><option value="">すべて</option><option value="APPLICATION_STARTED">申込受付</option><option value="SURVEY_IN_PROGRESS">回答中</option><option value="SURVEY_COMPLETED">回答完了</option></select></div>
<div class="form-row"><label for="channel-filter">Entry Channel</label><select id="channel-filter"><option value="">すべて</option><option value="WEB">Web</option><option value="SALES_VISIT">営業訪問</option></select></div>
</div>
<div id="admin-error" class="error-message" role="alert" hidden></div><p id="list-status" role="status">読み込み中…</p>
<div class="diagnosis-table"><table><thead><tr><th>顧客会社</th><th>Diagnosis Status</th><th>Next Action</th><th>Entry Channel</th><th>担当者</th><th>顧客連絡先</th><th>Future概要</th><th>Survey状態</th><th>Assessment Status</th></tr></thead><tbody id="case-list"></tbody></table></div>
<div class="diagnosis-actions"><button id="previous" class="btn btn-secondary" disabled>前へ</button><button id="next" class="btn btn-secondary" disabled>次へ</button><button id="refresh" class="btn btn-secondary">再読み込み</button></div>
</section></main></body></html>
