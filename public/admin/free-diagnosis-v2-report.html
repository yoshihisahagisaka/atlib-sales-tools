<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>診断レポート編集 | atLIB Admin</title><link rel="stylesheet" href="/admin/free-diagnosis-v2.css"><link rel="stylesheet" href="/admin/free-diagnosis-v2-report.css"></head><body>
<main class="report-editor-shell"><header class="report-editor-header"><div><p class="eyebrow">IT経営KAIZEN 無料診断</p><h1>顧客向けレポートを確認・編集</h1><p class="subtitle">分析の内容は変更せず、顧客へお渡しする表現を整えます。</p></div><nav class="nav"><button id="saveReport" type="button">レポートを保存</button><button id="printReport" class="secondary" type="button">印刷・PDF保存</button><a id="backToAnalysis" class="button secondary" href="#">ヒアリング後の整理へ戻る</a></nav></header>
<p id="reportMessage" class="status hidden" role="status"></p>
<section id="reportUnavailable" class="card unavailable hidden"><h2>レポートを開けませんでした。</h2><p>案件とレポートの状態を確認してください。</p></section>
<section id="reportWorkspace" class="report-editor-grid hidden"><form id="reportForm" class="report-form" novalidate><h2>レポート編集</h2><p class="editor-note">この画面で編集するのは、レポートの表示内容だけです。診断の回答や分析内容は変更されません。</p><section class="edit-group"><h3>宛名・発行情報</h3><label>企業名<input id="recipientCompany" required maxlength="500"></label><label>役職<input id="recipientRole" maxlength="200"></label><label>氏名<input id="recipientName" maxlength="200"></label><label>診断実施日<input id="diagnosisDate" type="date" required></label></section><section id="sectionEditors"></section><section class="edit-group"><h3>今後のご提案</h3><p class="editor-note">確認対象は、分析で示された候補から営業担当者が選びます。候補そのものは変更されません。</p><div id="assessmentCandidates"></div><label>想定実施期間<input id="durationText" maxlength="500" placeholder="例：2〜4週間"></label><label>ご提案金額（税別）<input id="priceExcludingTaxText" maxlength="500" placeholder="例：個別にご相談のうえお見積り"></label></section><div class="editor-save-bar"><button type="submit">レポートを保存</button></div></form><section class="preview-column"><div class="preview-heading"><h2>A4プレビュー</h2><p>印刷時はA4縦のレイアウトで表示されます。</p></div><article id="reportPreview" class="a4-report" aria-label="レポートプレビュー"></article></section></section>
</main><script src="/admin/free-diagnosis-v2-common.js"></script><script src="/admin/free-diagnosis-v2-report.js"></script></body></html>
