<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>業務KAIZEN 代理入力 | atLIB Sales Tools</title><link rel="stylesheet" href="/admin/partner-leads.css">
  <style>
    .proxy-grid{display:grid;gap:16px}.panel{background:#fff;border:1px solid #d9e1ea;border-radius:12px;padding:18px}.question{border-top:1px solid #e3e8ef;padding:15px 0}.options{display:grid;gap:8px}.options label{display:flex;gap:8px;align-items:flex-start}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{padding:11px 16px;border:0;border-radius:8px;background:#176b5b;color:#fff;font-weight:700}.actions button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:1.5em}.error{color:#a32626}.identity{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.identity div,.axis-list div{padding:10px;background:#f3f7fa}.result h3{margin:18px 0 8px}.result ul{margin:0;padding-left:1.4em}.axis-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}.axis-list dt{font-weight:700}.axis-list dd{margin:4px 0 0}@media(max-width:760px){.identity,.axis-list{grid-template-columns:1fr}.actions button{width:100%}.admin-shell{padding:18px 12px}}
  </style>
</head>
<body><main class="admin-shell"><header class="admin-header"><div><p class="eyebrow">atLIB Sales Tools</p><h1>業務KAIZEN 15問代理入力</h1><p>Sales Activityを正本として下書き・再開・確定します。</p></div></header>
<div class="proxy-grid">
  <section class="panel"><h2>対象顧客</h2><div id="identity" class="identity"></div><p id="load-status" class="status" role="status"></p></section>
  <section class="panel"><h2>15問</h2><form id="answers"><div id="questions"></div><div class="actions"><button id="save" type="button">下書きを保存</button><button id="complete" type="button">回答を確定</button></div><p id="save-status" class="status" role="status"></p></form></section>
  <section class="panel"><h2>確定前の確認</h2><label><input id="purpose" type="checkbox"> 業務KAIZEN代理入力の目的を説明・確認しました</label><br><label><input id="privacy" type="checkbox"> 個人情報の取扱いを説明・確認しました</label></section>
  <section id="result-panel" class="panel" hidden><h2>診断結果</h2><div id="result" class="result"></div></section>
</div></main>
<script>(()=>{'use strict';
const api='/api/admin/business-kaizen',activityId=new URLSearchParams(location.search).get('salesActivityId');let diagnosis=null,contract=null,busy=false;
const byId=id=>document.getElementById(id);
const status=(message,error=false)=>{const node=byId('save-status');node.textContent=message;node.className=`status${error?' error':''}`};
async function request(path,options={}){const response=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),body=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(body.error||'REQUEST_FAILED');error.status=response.status;throw error}return body}
function renderIdentity(){const root=byId('identity');root.replaceChildren();for(const [label,value] of [['企業',diagnosis.companyName],['担当者',diagnosis.contactName],['サービス',diagnosis.selectedService]]){const box=document.createElement('div'),title=document.createElement('b'),text=document.createElement('p');title.textContent=label;text.textContent=String(value||'');box.append(title,text);root.append(box)}}
function handleQ02(input){const feedback=byId('q02-feedback');if(input.value==='UNKNOWN'&&input.checked){for(const other of document.querySelectorAll('input[name="Q02"]:checked'))if(other!==input)other.checked=false;feedback.textContent='';return}if(input.value!=='UNKNOWN'&&input.checked){const unknown=document.querySelector('input[name="Q02"][value="UNKNOWN"]');if(unknown)unknown.checked=false;const normal=[...document.querySelectorAll('input[name="Q02"]:checked')].filter(item=>item.value!=='UNKNOWN');if(normal.length>3){input.checked=false;feedback.textContent='通常の選択肢は3つまで選択できます。';return}}feedback.textContent=''}
function renderQuestions(){const root=byId('questions'),saved=diagnosis.currentAnswers||{};root.replaceChildren();for(const question of contract.items){const fieldset=document.createElement('fieldset'),legend=document.createElement('legend'),options=document.createElement('div');fieldset.className='question';legend.textContent=`${question.id}. ${question.text}`;options.className='options';fieldset.append(legend);for(const [label,value] of question.options){const row=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span'),current=saved[question.id];input.type=question.multiple?'checkbox':'radio';input.name=question.id;input.value=String(value);input.dataset.numeric=typeof value==='number'?'true':'false';input.checked=Array.isArray(current)?current.includes(value):current===value;if(question.id==='Q02')input.addEventListener('change',()=>handleQ02(input));text.textContent=label;row.append(input,text);options.append(row)}fieldset.append(options);if(question.id==='Q02'){const feedback=document.createElement('p');feedback.id='q02-feedback';feedback.className='status error';feedback.setAttribute('role','status');fieldset.append(feedback)}root.append(fieldset)}}
function collect(){const answers={};for(const question of contract.items){const selected=[...document.querySelectorAll(`input[name="${question.id}"]:checked`)];if(!selected.length)continue;const value=input=>input.dataset.numeric==='true'?Number(input.value):input.value;answers[question.id]=question.multiple?selected.map(value):value(selected[0])}return answers}
function renderResult(snapshot){const root=byId('result');root.replaceChildren();const directionTitle=document.createElement('h3'),direction=document.createElement('p');directionTitle.textContent='診断結果の説明';direction.textContent=String(snapshot.renderedImprovementDirection||'');root.append(directionTitle,direction);const factsTitle=document.createElement('h3'),facts=document.createElement('ul');factsTitle.textContent='確認できた事実';for(const fact of snapshot.confirmedFacts||[]){const item=document.createElement('li');item.textContent=String(fact);facts.append(item)}if(!facts.childElementCount){const item=document.createElement('li');item.textContent='確認できた事実はありません。';facts.append(item)}root.append(factsTitle,facts);const axesTitle=document.createElement('h3'),axes=document.createElement('dl'),labels={workflow:'業務フロー',information:'情報管理',decision:'意思決定',dependency:'属人性',scalability:'拡張性',toolConstraint:'ツール制約'};axesTitle.textContent='6観点';axes.className='axis-list';for(const [key,value] of Object.entries(snapshot.sixAxisGaps||{})){const box=document.createElement('div'),term=document.createElement('dt'),detail=document.createElement('dd');term.textContent=labels[key]||key;detail.textContent=`level: ${value.level} / coverage: ${value.coverage}`;box.append(term,detail);axes.append(box)}root.append(axesTitle,axes)}
function setBusy(value){busy=value;const disabled=value||(diagnosis&&diagnosis.inputState==='COMPLETED');byId('save').disabled=disabled;byId('complete').disabled=disabled}
async function save(manageBusy=true){if(busy&&manageBusy)return null;if(manageBusy)setBusy(true);try{status('保存中です…');const result=await request(`/diagnoses/${diagnosis.id}/draft-answers`,{method:'PUT',body:JSON.stringify({expectedRevision:diagnosis.revision,answers:collect()})});diagnosis.revision=result.revision;diagnosis.currentAnswers=result.currentAnswers;status(`下書きを保存しました（revision ${result.revision}）`);return result}finally{if(manageBusy)setBusy(false)}}
byId('save').onclick=()=>save().catch(error=>status(error.message==='REVISION_CONFLICT'?'別の画面で更新されています。再読み込みしてください。':`保存できませんでした: ${error.message}`,true));
byId('complete').onclick=async()=>{if(busy)return;if(!byId('purpose').checked||!byId('privacy').checked){status('目的と個人情報の取扱いを確認してください。',true);return}setBusy(true);try{await save(false);const result=await request(`/diagnoses/${diagnosis.id}/complete`,{method:'POST',body:JSON.stringify({expectedRevision:diagnosis.revision,purposeConfirmed:true,privacyHandlingConfirmed:true,consentWordingVersion:contract.consentWordingVersion})});diagnosis.revision=result.revision;diagnosis.inputState='COMPLETED';byId('result-panel').hidden=false;renderResult(result.diagnosisSnapshot);status('診断を確定しました。')}catch(error){status(error.message==='INCOMPLETE_ANSWERS'?'15問すべてに回答してください。':`確定できませんでした: ${error.message}`,true)}finally{setBusy(false)}};
(async()=>{if(!activityId){byId('load-status').textContent='salesActivityIdが必要です。';return}try{contract=await request('/questions');const draft=await request('/diagnoses/proxy-drafts',{method:'POST',body:JSON.stringify({salesActivityId:activityId})});diagnosis=await request(`/diagnoses/${draft.diagnosisId}`);renderIdentity();renderQuestions();byId('load-status').textContent=draft.created?'新しい下書きを開始しました。':'保存済みの下書きを再開しました。';if(diagnosis.inputState==='COMPLETED'){byId('result-panel').hidden=false;renderResult(diagnosis.diagnosisSnapshot);setBusy(false)}}catch(error){byId('load-status').textContent=`開始できませんでした: ${error.message}`}})();
})();</script></body></html>
