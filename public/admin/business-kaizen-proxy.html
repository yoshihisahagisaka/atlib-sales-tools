<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>業務KAIZEN 代理入力 | atLIB Sales Tools</title><link rel="stylesheet" href="/admin/partner-leads.css">
<style>.proxy-grid{display:grid;gap:16px}.panel{background:#fff;border:1px solid #d9e1ea;border-radius:12px;padding:18px}.question{border-top:1px solid #e3e8ef;padding:15px 0}.options{display:grid;gap:8px}.options label{display:flex;gap:8px;align-items:flex-start}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{padding:11px 16px;border:0;border-radius:8px;background:#176b5b;color:#fff;font-weight:700}.actions .secondary{background:#fff;color:#1f3556;border:1px solid #8fa0b2}.status{min-height:1.5em}.error{color:#a32626}.identity{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.identity div{padding:10px;background:#f3f7fa}.result{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){.identity{grid-template-columns:1fr}.actions button{width:100%}.admin-shell{padding:18px 12px}}</style></head>
<body><main class="admin-shell"><header class="admin-header"><div><p class="eyebrow">atLIB Sales Tools</p><h1>業務KAIZEN 15問代理入力</h1><p>Sales Activityを正本として下書き・再開・確定します。</p></div></header>
<div class="proxy-grid"><section class="panel"><h2>対象顧客</h2><div id="identity" class="identity"></div><p id="load-status" class="status" role="status"></p></section>
<section class="panel"><h2>15問</h2><form id="answers"><div id="questions"></div><div class="actions"><button id="save" type="button">下書き保存</button><button id="complete" type="button">回答を確定</button></div><p id="save-status" class="status" role="status"></p></form></section>
<section class="panel"><h2>確定前の確認</h2><label><input id="purpose" type="checkbox"> 業務KAIZEN代理入力の目的を説明・確認しました</label><br><label><input id="privacy" type="checkbox"> 個人情報の取扱いを説明・確認しました</label></section>
<section id="result-panel" class="panel" hidden><h2>診断結果</h2><div id="result" class="result"></div></section></div></main>
<script>(()=>{'use strict';const api='/api/admin/business-kaizen',params=new URLSearchParams(location.search),activityId=params.get('salesActivityId');let diagnosis=null,contract=null;
const byId=id=>document.getElementById(id),status=(message,error=false)=>{const n=byId('save-status');n.textContent=message;n.className=`status${error?' error':''}`};
async function request(path,options={}){const r=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(b.error||'REQUEST_FAILED');e.status=r.status;throw e}return b}
function renderIdentity(){const n=byId('identity');n.replaceChildren();for(const [label,value] of [['企業',diagnosis.companyName],['担当者',diagnosis.contactName],['サービス',diagnosis.selectedService]]){const d=document.createElement('div'),b=document.createElement('b'),p=document.createElement('p');b.textContent=label;p.textContent=String(value||'');d.append(b,p);n.append(d)}}
function renderQuestions(){const root=byId('questions');root.replaceChildren();const saved=diagnosis.currentAnswers||{};for(const q of contract.items){const section=document.createElement('fieldset');section.className='question';const legend=document.createElement('legend');legend.textContent=`${q.id}. ${q.text}`;section.append(legend);const options=document.createElement('div');options.className='options';for(const [label,value] of q.options){const row=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type=q.multiple?'checkbox':'radio';input.name=q.id;input.value=String(value);input.dataset.numeric=typeof value==='number'?'true':'false';const current=saved[q.id];input.checked=Array.isArray(current)?current.includes(value):current===value;if(q.id==='Q02'&&q.multiple)input.addEventListener('change',()=>{const selected=[...document.querySelectorAll('input[name="Q02"]:checked')];if(input.value==='UNKNOWN'&&input.checked)for(const other of selected)if(other!==input)other.checked=false;else if(input.value!=='UNKNOWN'&&input.checked){const unknown=document.querySelector('input[name="Q02"][value="UNKNOWN"]');if(unknown)unknown.checked=false}});span.textContent=label;row.append(input,span);options.append(row)}section.append(options);root.append(section)}}
function collect(){const out={};for(const q of contract.items){const selected=[...document.querySelectorAll(`input[name="${q.id}"]:checked`)];if(!selected.length)continue;const value=input=>input.dataset.numeric==='true'?Number(input.value):input.value;out[q.id]=q.multiple?selected.map(value):value(selected[0])}return out}
async function save(){status('保存中です…');const r=await request(`/diagnoses/${diagnosis.id}/draft-answers`,{method:'PUT',body:JSON.stringify({expectedRevision:diagnosis.revision,answers:collect()})});diagnosis.revision=r.revision;diagnosis.currentAnswers=r.currentAnswers;status(`下書きを保存しました（revision ${r.revision}）`);return r}
byId('save').onclick=()=>save().catch(e=>status(e.message==='REVISION_CONFLICT'?'別の画面で更新されています。再読み込みしてください。':'保存できませんでした: '+e.message,true));
byId('complete').onclick=async()=>{if(!byId('purpose').checked||!byId('privacy').checked){status('目的と個人情報の取扱いを確認してください。',true);return}try{await save();const r=await request(`/diagnoses/${diagnosis.id}/complete`,{method:'POST',body:JSON.stringify({expectedRevision:diagnosis.revision,purposeConfirmed:true,privacyHandlingConfirmed:true,consentWordingVersion:contract.consentWordingVersion})});diagnosis.revision=r.revision;byId('result-panel').hidden=false;byId('result').textContent=JSON.stringify(r.diagnosisSnapshot,null,2);status('診断を確定しました。')}catch(e){status(e.message==='INCOMPLETE_ANSWERS'?'15問すべてに回答してください。':'確定できませんでした: '+e.message,true)}};
(async()=>{if(!activityId){byId('load-status').textContent='salesActivityIdが必要です。';return}try{contract=await request('/questions');const draft=await request('/diagnoses/proxy-drafts',{method:'POST',body:JSON.stringify({salesActivityId:activityId})});diagnosis=await request(`/diagnoses/${draft.diagnosisId}`);renderIdentity();renderQuestions();byId('load-status').textContent=draft.created?'新しい下書きを開始しました。':'保存済みの下書きを再開しました。';if(diagnosis.inputState==='COMPLETED'){byId('result-panel').hidden=false;byId('result').textContent=JSON.stringify(diagnosis.diagnosisSnapshot,null,2);byId('save').disabled=true;byId('complete').disabled=true}}catch(e){byId('load-status').textContent='開始できませんでした: '+e.message}})();})();</script></body></html>
