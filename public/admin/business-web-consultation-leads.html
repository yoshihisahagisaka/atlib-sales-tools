<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Web 無料相談 | atLIB Admin</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page" style="max-width:1200px"><h1>Business Web 無料相談</h1><div class="card"><label>対応状況 <select id="status"><option value="">すべて</option><option value="new">新規</option><option value="contacted">連絡中</option><option value="scheduled">日程確定</option><option value="completed">相談完了</option><option value="closed">終了</option></select></label><p id="message">読み込み中...</p><table id="table" style="display:none"><thead><tr><th>申込日時</th><th>会社名</th><th>お名前</th><th>状態</th><th>Direction</th><th>予約</th><th></th></tr></thead><tbody></tbody></table></div></main><script>const labels={new:'新規',contacted:'連絡中',scheduled:'日程確定',completed:'相談完了',closed:'終了'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const m=document.querySelector('#message'),t=document.querySelector('#table'),b=t.querySelector('tbody');m.textContent='読み込み中...';t.style.display='none';try{const q=document.querySelector('#status').value;const r=await fetch('/api/admin/business-web-consultation-leads'+(q?'?status='+encodeURIComponent(q):''));if(!r.ok)throw 0;const d=await r.json();b.innerHTML=d.items.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('ja-JP')}</td><td>${esc(x.companyName)}</td><td>${esc(x.personName)}</td><td>${labels[x.status]||esc(x.status)}</td><td>${esc(x.direction||'-')} / ${esc(x.directionStatus)}</td><td>${x.scheduledAt?'日程あり':'未設定'}</td><td><a href="/admin/business-web-consultation-lead-detail.html?id=${encodeURIComponent(x.id)}">詳細</a></td></tr>`).join('');m.textContent=d.items.length?'':'該当する相談はありません。';t.style.display=d.items.length?'table':'none'}catch{m.textContent='一覧の取得に失敗しました。再読み込みしてください。'}}document.querySelector('#status').onchange=load;load();</script></body></html>
