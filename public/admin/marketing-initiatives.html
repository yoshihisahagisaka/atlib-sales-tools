<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>施策管理 | atLIB Sales Tools</title>
<link rel="stylesheet" href="/admin/admin-common.css"><style>
body{background:#f4f6f8;color:#172033}.admin-shell{max-width:1120px;margin:auto;padding:1rem}.card{background:#fff;border:1px solid #dfe4ea;border-radius:10px;padding:1rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.row{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap}label{display:grid;gap:.3rem;font-weight:600}input,select{padding:.55rem;border:1px solid #aeb8c4;border-radius:6px}button,.button{display:inline-flex;align-items:center;justify-content:center;padding:.55rem .8rem;border:1px solid #1f5f99;border-radius:6px;background:#1f5f99;color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap}.secondary{background:#fff;color:#1f5f99}.initiative-list{display:grid;gap:1rem}.initiative-card{border:1px solid #d7dee7;border-radius:10px;background:#fff;padding:1rem;box-shadow:0 1px 2px rgba(23,32,51,.05)}.initiative-header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;padding-bottom:.8rem;border-bottom:1px solid #e5eaf0}.initiative-header h3{margin:0 0 .35rem;font-size:1.05rem;overflow-wrap:anywhere}.service-label{margin:0;color:#526173;font-size:.86rem}.status-badge{flex:none;padding:.25rem .6rem;border-radius:999px;background:#e3f4e9;color:#176a3b;font-size:.8rem;font-weight:700}.status-badge.inactive{background:#eef1f4;color:#5d6875}.initiative-section{margin-top:.9rem}.initiative-section h4{margin:0 0 .55rem;font-size:.82rem;color:#526173}.utm-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem}.utm-item{min-width:0;padding:.55rem;background:#f7f9fb;border-radius:6px}.utm-key{display:block;margin-bottom:.2rem;color:#687587;font-size:.72rem;text-transform:uppercase}.utm-value{display:block;font-family:ui-monospace,monospace;font-size:.82rem;overflow-wrap:anywhere}.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}.kpi-item{padding:.65rem;background:#f7f9fb;border-radius:6px}.kpi-label{display:block;color:#526173;font-size:.78rem}.kpi-value{display:block;margin-top:.2rem;font-size:1.15rem;font-weight:700}.initiative-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.empty-state{margin:0;padding:1.25rem;text-align:center;color:#687587;background:#f7f9fb;border-radius:8px}.error{color:#a32626}.success{color:#176a3b}@media(max-width:820px){.utm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.grid{grid-template-columns:1fr}.initiative-header{align-items:center}.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.utm-grid,.kpi-grid{grid-template-columns:1fr}.initiative-actions{display:grid}.initiative-actions .button,.initiative-actions button{width:100%}}
</style></head><body><main class="admin-shell"><header><p>atLIB Sales Tools</p><h1>施策管理</h1><p>UTM条件と施策を登録し、該当する無料診断の進捗を確認します。</p><a class="button secondary" href="/admin/free-diagnosis-v1.html">案件一覧へ戻る</a></header>
<section class="card"><h2>新しい施策</h2><form id="form"><div class="grid">
<label>施策名<input id="name" maxlength="200" required placeholder="例：守成クラブ 2026年10月配布チラシ"></label>
<label>サービス<select id="service"><option value="IT_KAIZEN">IT経営KAIZEN</option></select></label>
<label>UTM source<input id="source" maxlength="200" placeholder="shusei_club"></label><label>UTM medium<input id="medium" maxlength="200" placeholder="flyer"></label>
<label>UTM campaign<input id="campaign" maxlength="200" placeholder="202610_shusei"></label><label>UTM content<input id="content" maxlength="200" placeholder="itkaizen_a4"></label>
<label>UTM term（任意）<input id="term" maxlength="200"></label></div>
<p>UTM条件は完全一致で照合します。空欄も照合条件の一部です。</p><button type="submit">施策を登録</button><p id="message" role="status"></p></form></section>
<section class="card"><div class="row"><h2>登録済み施策</h2><button id="reload" class="secondary">更新</button></div><div id="items" class="initiative-list"></div></section>
</main><script>
const $=id=>document.getElementById(id); const api='/api/admin/marketing-initiatives';
async function request(path='',options={}){const response=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok){const e=new Error(body.error||'REQUEST_FAILED');e.status=response.status;throw e;}return body;}
const value=id=>$(id).value.trim();
const element=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;};
function labelledValue(className,label,value){const item=element('div',className);item.append(element('span',className==='utm-item'?'utm-key':'kpi-label',label),element('span',className==='utm-item'?'utm-value':'kpi-value',String(value)));return item;}
function serviceLabel(serviceKey){return ({IT_KAIZEN:'IT経営KAIZEN',BUSINESS_WEB:'Business Web'})[serviceKey]||'対象サービス未確認';}
async function load(){const {items}=await request();const list=$('items');list.replaceChildren();if(!items.length){list.append(element('p','empty-state','登録済みの施策はありません。'));return;}for(const i of items){const card=element('article','initiative-card');card.dataset.initiativeId=i.initiativeId;const header=element('header','initiative-header');const title=element('div');title.append(element('h3','',i.initiativeName),element('p','service-label',serviceLabel(i.serviceKey)));header.append(title,element('span',`status-badge${i.isActive?'':' inactive'}`,i.isActive?'有効':'無効'));const utmSection=element('section','initiative-section');utmSection.append(element('h4','','UTM条件'));const utm=element('div','utm-grid');for(const [label,current] of [['source',i.utmSource],['medium',i.utmMedium],['campaign',i.utmCampaign],['content',i.utmContent],['term',i.utmTerm]])utm.append(labelledValue('utm-item',label,current??'未設定'));utmSection.append(utm);const kpiSection=element('section','initiative-section');kpiSection.append(element('h4','','進捗'));const kpi=element('div','kpi-grid');for(const [label,current] of [['申込み件数',i.kpi.applications],['本人回答件数',i.kpi.customerSelf],['営業代理入力件数',i.kpi.staffProxy],['ヒアリング完了件数',i.kpi.hearingCompleted],['レポート作成件数',i.kpi.reportCreated],['レポート承認件数',i.kpi.reportApproved]])kpi.append(labelledValue('kpi-item',label,current));kpiSection.append(kpi);const actions=element('div','initiative-actions');const link=element('a','button secondary','該当案件を見る');link.href=`/admin/free-diagnosis-v1.html?initiativeId=${encodeURIComponent(i.initiativeId)}`;actions.append(link);if(i.isActive){const button=element('button','secondary','無効化');button.type='button';button.onclick=async()=>{if(!confirm('この施策を無効化しますか？'))return;await request(`/${i.initiativeId}/deactivate`,{method:'POST'});await load();};actions.append(button);}card.append(header,utmSection,kpiSection,actions);list.append(card);}}
$('form').onsubmit=async event=>{event.preventDefault();const message=$('message');message.className='';message.textContent='';const optional=id=>value(id)||undefined;try{await request('',{method:'POST',body:JSON.stringify({initiativeName:value('name'),serviceKey:$('service').value,utmSource:optional('source'),utmMedium:optional('medium'),utmCampaign:optional('campaign'),utmContent:optional('content'),utmTerm:optional('term')})});message.className='success';message.textContent='施策を登録しました。';event.target.reset();await load();}catch(error){message.className='error';message.textContent=error.status===409?'同じサービスとUTM条件の施策がすでに登録されています。':'施策を登録できませんでした。入力内容を確認してください。';}};
$('reload').onclick=()=>load().catch(()=>{$('message').textContent='施策を読み込めませんでした。';});load().catch(()=>{$('message').textContent='施策を読み込めませんでした。';});
</script></body></html>
