<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>施策管理 | atLIB Sales Tools</title>
<link rel="stylesheet" href="/admin/admin-common.css"><style>
body{background:#f4f6f8;color:#172033}.admin-shell{max-width:1120px;margin:auto;padding:1rem}.card{background:#fff;border:1px solid #dfe4ea;border-radius:10px;padding:1rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.row{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap}label{display:grid;gap:.3rem;font-weight:600}input,select{padding:.55rem;border:1px solid #aeb8c4;border-radius:6px}button,.button{padding:.55rem .8rem;border:1px solid #1f5f99;border-radius:6px;background:#1f5f99;color:#fff;text-decoration:none;cursor:pointer}.secondary{background:#fff;color:#1f5f99}table{width:100%;border-collapse:collapse}th,td{padding:.65rem;border-bottom:1px solid #dfe4ea;text-align:left;vertical-align:top}th{background:#f7f9fb}.status{font-weight:700}.inactive{color:#6b7280}.error{color:#a32626}.success{color:#176a3b}.utm{font-family:ui-monospace,monospace;font-size:.82rem;overflow-wrap:anywhere}.kpi{white-space:nowrap}@media(max-width:720px){.grid{grid-template-columns:1fr}.table-wrap{overflow-x:auto}}
</style></head><body><main class="admin-shell"><header><p>atLIB Sales Tools</p><h1>施策管理</h1><p>UTM条件と施策を登録し、該当する無料診断の進捗を確認します。</p><a class="button secondary" href="/admin/free-diagnosis-v1.html">案件一覧へ戻る</a></header>
<section class="card"><h2>新しい施策</h2><form id="form"><div class="grid">
<label>施策名<input id="name" maxlength="200" required placeholder="例：守成クラブ 2026年10月配布チラシ"></label>
<label>サービス<select id="service"><option value="IT_KAIZEN">IT経営KAIZEN</option></select></label>
<label>UTM source<input id="source" maxlength="200" placeholder="shusei_club"></label><label>UTM medium<input id="medium" maxlength="200" placeholder="flyer"></label>
<label>UTM campaign<input id="campaign" maxlength="200" placeholder="202610_shusei"></label><label>UTM content<input id="content" maxlength="200" placeholder="itkaizen_a4"></label>
<label>UTM term（任意）<input id="term" maxlength="200"></label></div>
<p>UTM条件は完全一致で照合します。空欄も照合条件の一部です。</p><button type="submit">施策を登録</button><p id="message" role="status"></p></form></section>
<section class="card"><div class="row"><h2>登録済み施策</h2><button id="reload" class="secondary">更新</button></div><div class="table-wrap"><table><thead><tr><th>施策</th><th>UTM条件</th><th>申込み</th><th>回答経路</th><th>進捗</th><th>操作</th></tr></thead><tbody id="items"></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id); const api='/api/admin/marketing-initiatives';
async function request(path='',options={}){const response=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok){const e=new Error(body.error||'REQUEST_FAILED');e.status=response.status;throw e;}return body;}
const value=id=>$(id).value.trim(); const td=(text,cls)=>{const cell=document.createElement('td');cell.textContent=text;if(cls)cell.className=cls;return cell;};
function utmText(i){return [['source',i.utmSource],['medium',i.utmMedium],['campaign',i.utmCampaign],['content',i.utmContent],['term',i.utmTerm]].map(([k,v])=>`${k}: ${v??'未設定'}`).join('\n');}
async function load(){const {items}=await request();const body=$('items');body.replaceChildren();if(!items.length){const row=document.createElement('tr');const cell=td('登録済みの施策はありません。');cell.colSpan=6;row.append(cell);body.append(row);return;}for(const i of items){const row=document.createElement('tr');const name=td(`${i.initiativeName}\n${i.isActive?'有効':'無効'}`,i.isActive?'status':'status inactive');name.style.whiteSpace='pre-line';row.append(name,td(utmText(i),'utm'),td(String(i.kpi.applications),'kpi'),td(`本人回答 ${i.kpi.customerSelf}\n営業代理入力 ${i.kpi.staffProxy}`,'kpi'),td(`ヒアリング完了 ${i.kpi.hearingCompleted}\nレポート作成 ${i.kpi.reportCreated}\n承認 ${i.kpi.reportApproved}`,'kpi'));const actions=document.createElement('td');const link=document.createElement('a');link.className='button secondary';link.textContent='該当案件';link.href=`/admin/free-diagnosis-v1.html?initiativeId=${encodeURIComponent(i.initiativeId)}`;actions.append(link);if(i.isActive){const button=document.createElement('button');button.textContent='無効化';button.className='secondary';button.onclick=async()=>{if(!confirm('この施策を無効化しますか？'))return;await request(`/${i.initiativeId}/deactivate`,{method:'POST'});await load();};actions.append(button);}row.append(actions);body.append(row);}}
$('form').onsubmit=async event=>{event.preventDefault();const message=$('message');message.className='';message.textContent='';const optional=id=>value(id)||undefined;try{await request('',{method:'POST',body:JSON.stringify({initiativeName:value('name'),serviceKey:$('service').value,utmSource:optional('source'),utmMedium:optional('medium'),utmCampaign:optional('campaign'),utmContent:optional('content'),utmTerm:optional('term')})});message.className='success';message.textContent='施策を登録しました。';event.target.reset();await load();}catch(error){message.className='error';message.textContent=error.status===409?'同じサービスとUTM条件の施策がすでに登録されています。':'施策を登録できませんでした。入力内容を確認してください。';}};
$('reload').onclick=()=>load().catch(()=>{$('message').textContent='施策を読み込めませんでした。';});load().catch(()=>{$('message').textContent='施策を読み込めませんでした。';});
</script></body></html>
