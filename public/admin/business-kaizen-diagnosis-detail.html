<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>業務KAIZEN Diagnosis詳細 | atLIB Sales Tools</title><link rel="stylesheet" href="/admin/partner-leads.css">
<style>.panel{background:#fff;border:1px solid #d9e1ea;border-radius:12px;padding:18px;margin-bottom:16px}.summary,.axis-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.summary div,.axis-list div{background:#f3f7fa;padding:10px;overflow-wrap:anywhere}.summary dt,.axis-list dt{font-weight:700}.summary dd,.axis-list dd{margin:5px 0 0}.button{display:inline-block;padding:10px 14px;border-radius:8px;background:#176b5b;color:#fff;text-decoration:none;font-weight:700}.button[hidden]{display:none}.answers{display:grid;gap:12px}.answer{border-bottom:1px solid #d9e1ea;padding-bottom:10px}.answer dt{font-weight:700}.answer dd{margin:5px 0 0;overflow-wrap:anywhere}.facts{padding-left:1.4em}.status{min-height:1.5em}.error{color:#a32626}@media(max-width:760px){.summary,.axis-list{grid-template-columns:1fr}.admin-shell{padding:18px 12px}}</style></head>
<body><main class="admin-shell"><header class="admin-header"><div><p class="eyebrow">atLIB Sales Tools</p><h1>業務KAIZEN Diagnosis詳細</h1></div><nav class="admin-nav"><a href="/admin/business-kaizen-diagnoses.html">案件一覧</a></nav></header>
<p id="status" class="status" role="status">読み込み中です…</p><div id="content" hidden>
<section class="panel"><h2>企業・担当者</h2><dl id="identity" class="summary"></dl><a id="resume" class="button" hidden>代理入力を再開</a></section>
<section class="panel"><h2>診断結果</h2><h3>診断結果の説明</h3><p id="direction-text"></p><h3>確認できた事実</h3><ul id="facts" class="facts"></ul><h3>6観点</h3><dl id="axes" class="axis-list"></dl></section>
<section class="panel"><h2>Original Answers</h2><dl id="original" class="answers"></dl></section>
<section class="panel"><h2>Current Answers</h2><dl id="current" class="answers"></dl></section>
<section class="panel"><h2>Attribution</h2><dl id="attribution" class="summary"></dl></section>
<section class="panel"><h2>営業情報</h2><dl id="sales" class="summary"></dl></section>
</div></main><script>(()=>{'use strict';const api='/api/admin/business-kaizen',byId=id=>document.getElementById(id),dash=value=>value===null||value===undefined||value===''?'—':String(value);
async function request(path){const response=await fetch(api+path,{headers:{'Content-Type':'application/json'}}),body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'REQUEST_FAILED');return body}
function addDefinition(root,label,value){const box=document.createElement('div'),term=document.createElement('dt'),detail=document.createElement('dd');term.textContent=label;detail.textContent=dash(value);box.append(term,detail);root.append(box)}
function formatDate(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.valueOf())?'—':date.toLocaleString('ja-JP')}
function renderAnswers(rootId,answers,questions){const root=byId(rootId);root.replaceChildren();if(!answers){addDefinition(root,'回答','—');return}const options=new Map(questions.items.map(question=>[question.id,{question,labels:new Map(question.options.map(([label,value])=>[String(value),label]))}]));for(const question of questions.items){if(!Object.prototype.hasOwnProperty.call(answers,question.id))continue;const entry=options.get(question.id),values=Array.isArray(answers[question.id])?answers[question.id]:[answers[question.id]],box=document.createElement('div'),term=document.createElement('dt'),detail=document.createElement('dd');box.className='answer';term.textContent=`${question.id}. ${question.text}`;detail.textContent=values.map(value=>entry.labels.get(String(value))||String(value)).join('、');box.append(term,detail);root.append(box)}if(!root.childElementCount)addDefinition(root,'回答','—')}
function renderSnapshot(snapshot){byId('direction-text').textContent=snapshot?dash(snapshot.renderedImprovementDirection):'未確定';const facts=byId('facts');facts.replaceChildren();for(const fact of snapshot?.confirmedFacts||[]){const item=document.createElement('li');item.textContent=String(fact);facts.append(item)}if(!facts.childElementCount){const item=document.createElement('li');item.textContent='—';facts.append(item)}const axes=byId('axes'),labels={workflow:'業務フロー',information:'情報管理',decision:'意思決定',dependency:'属人性',scalability:'拡張性',toolConstraint:'ツール制約'},levels={UNKNOWN:'不明',NONE:'なし',SMALL:'小',SOME:'一部',MODERATE:'中',LARGE:'大'},coverage={LOW:'低',MEDIUM:'中',HIGH:'高'};axes.replaceChildren();for(const [key,label] of Object.entries(labels)){const value=snapshot?.sixAxisGaps?.[key];addDefinition(axes,label,value?`レベル: ${levels[value.level]||value.level} / Coverage: ${coverage[value.coverage]||value.coverage}`:'—')}}
async function load(){const id=new URLSearchParams(location.search).get('id'),status=byId('status');if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)){status.className='status error';status.textContent='Diagnosis IDが不正です。';return}try{const [diagnosis,questions]=await Promise.all([request(`/diagnoses/${encodeURIComponent(id)}`),request('/questions')]);const identity=byId('identity');for(const [label,value] of [['会社名',diagnosis.companyName],['担当者名',diagnosis.contactName],['入力方法',diagnosis.entryChannel==='CUSTOMER_SELF'?'本人':'スタッフ代理'],['入力状態',diagnosis.inputState==='DRAFT'?'下書き':'完了'],['Diagnosis ID',diagnosis.id],['Sales Activity ID',diagnosis.salesActivityId],['Consultation Lead ID',diagnosis.consultationLeadId]])addDefinition(identity,label,value);if(diagnosis.entryChannel==='STAFF_PROXY'&&diagnosis.inputState==='DRAFT'&&diagnosis.salesActivityId){const resume=byId('resume');resume.href=`/admin/business-kaizen-proxy.html?salesActivityId=${encodeURIComponent(diagnosis.salesActivityId)}`;resume.hidden=false}renderSnapshot(diagnosis.diagnosisSnapshot);renderAnswers('original',diagnosis.originalAnswers,questions);renderAnswers('current',diagnosis.currentAnswers,questions);const attribution=byId('attribution'),attributionLabels={acquisitionSourceType:'獲得経路種別',acquisitionSourceName:'獲得経路名',utmSource:'UTM Source',utmMedium:'UTM Medium',utmCampaign:'UTM Campaign',utmContent:'UTM Content',utmTerm:'UTM Term',ctaSource:'CTA Source',landingUrl:'Landing URL',referrer:'Referrer'};for(const [key,label] of Object.entries(attributionLabels))addDefinition(attribution,label,diagnosis.attribution?.[key]);const sales=byId('sales');for(const [label,value] of [['営業Stage',diagnosis.currentStage],['Outcome',diagnosis.outcome],['面談予定日時',formatDate(diagnosis.scheduledAt)],['担当営業',diagnosis.ownerUserEmail||'未設定'],['作成日時',formatDate(diagnosis.createdAt)],['更新日時',formatDate(diagnosis.updatedAt)],['完了日時',formatDate(diagnosis.completedAt)]])addDefinition(sales,label,value);status.textContent='';byId('content').hidden=false}catch(error){status.className='status error';status.textContent=`詳細を読み込めませんでした: ${error.message}`}}
void load();})();</script></body></html>
