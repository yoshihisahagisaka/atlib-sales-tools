<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Web 無料相談 詳細 | atLIB Admin</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page" style="max-width:960px"><p><a href="/admin/business-web-consultation-leads.html">← 一覧へ戻る</a></p><h1>Business Web 無料相談 詳細</h1><p id="message">読み込み中...</p><div id="content" style="display:none"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={new:'新規',contacted:'連絡中',scheduled:'日程確定',completed:'相談完了',closed:'終了'};const section=(h,body)=>`<section class="card"><h2>${h}</h2>${body}</section>`;const list=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(typeof x==='string'?x:(x.question||x.purpose||JSON.stringify(x)))+'</li>').join('')+'</ul>':'<p>-</p>';async function load(){const id=new URLSearchParams(location.search).get('id'),m=document.querySelector('#message'),c=document.querySelector('#content');if(!id){m.textContent='idが指定されていません。';return}try{const r=await fetch('/api/admin/business-web-consultation-leads/'+encodeURIComponent(id));if(!r.ok)throw 0;const x=await r.json(),s=x.snapshot,p=x.preparation; c.innerHTML=section('1. Lead Information',`<p>${esc(x.companyName)} / ${esc(x.personName)}<br>${esc(x.email)} / ${esc(x.phone||'-')}<br>相談メモ: ${esc(x.consultationNote||'-')}</p>`)+section('2. 目指している状態',list(s.targetState.selected))+section('3. 今回確認できたFACT',list(s.confirmedFacts))+section('4. UNKNOWN',list(s.unknownItems))+section('5. 改善余地',Object.entries(s.sixAxisGaps).map(([k,v])=>`<p>${esc(k)}: ${esc(v.level)} / coverage ${esc(v.coverage)}</p>`).join(''))+section('6. 改善を進めるうえで注目したいこと',list(s.bottlenecks))+section('7. セルフチェックで示した改善の方向性',`<p>${esc(s.direction||'-')} / ${esc(s.directionStatus)} / confidence ${esc(s.confidence)}</p><p>${esc(s.renderedImprovementDirection)}</p>`)+section('8. Consultation Preparation',`<p>セルフチェック結果から自動準備された確認候補です。実際の相談では、担当者が内容を確認して使用します。</p><h3>最初に確認すること</h3>${list(p.confirmationPurposes)}<h3>標準質問</h3>${list(p.standardQuestions)}<h3>深掘り候補</h3>${list(p.deepDiveCandidates)}<h3>すでに確認済み</h3>${list(p.skipQuestions)}<h3>相談の進め方</h3>${list(p.consultationStory)}`)+section('9. Tracking / Consent',`<p>Privacy: ${x.consent.privacy} / 診断引継ぎ: ${x.consent.diagnosisTransfer}<br>同意version: ${esc(x.consent.wordingVersion)}<br>UTM source: ${esc(x.tracking.utmSource||'-')}<br>UTM medium: ${esc(x.tracking.utmMedium||'-')}<br>UTM campaign: ${esc(x.tracking.utmCampaign||'-')}<br>UTM content: ${esc(x.tracking.utmContent||'-')}<br>UTM term: ${esc(x.tracking.utmTerm||'-')}<br>CTA: ${esc(x.tracking.ctaSource||'-')}<br>Landing: ${esc(x.tracking.landingUrl||'-')}<br>Referrer: ${esc(x.tracking.referrer||'-')}</p>`)+section('10. Status / Scheduling',`<select id="status">${Object.keys(labels).map(v=>`<option value="${v}" ${x.status===v?'selected':''}>${labels[v]}</option>`).join('')}</select><button class="btn" id="save">保存</button><p id="saved"></p>`);m.style.display='none';c.style.display='block';document.querySelector('#save').onclick=async()=>{const rr=await fetch('/api/admin/business-web-consultation-leads/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.querySelector('#status').value})});document.querySelector('#saved').textContent=rr.ok?'保存しました。':'保存に失敗しました。'};}catch{m.textContent='詳細の取得に失敗しました。再読み込みしてください。'}}load();</script></body></html>
