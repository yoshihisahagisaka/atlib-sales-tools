<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design v2 ヒアリング後の整理 | atLIB Admin</title><link rel="stylesheet" href="/admin/free-diagnosis-v2.css"></head><body>
<main class="shell"><header class="topbar"><div><p class="eyebrow">IT経営KAIZEN 無料診断</p><h1>ヒアリング後の整理</h1><p class="subtitle">最初の回答、ヒアリング記録、現在の理解を分けて確認します。</p></div><nav class="nav"><button id="toReport" type="button">レポートを確認</button><a id="toHearing" class="button secondary" href="#">ヒアリング画面へ戻る</a><a class="button secondary" href="/admin/free-diagnosis-v1.html">案件一覧へ戻る</a></nav></header>
<section id="notice" class="card unavailable hidden"><h2>この案件はDesign v2の準備が完了していません。</h2><p>案件IDと準備状況を確認してください。</p></section>
<div id="answerReferenceControl" class="answer-reference-control hidden"><button id="openAnswerReference" class="secondary answer-reference-trigger" type="button" aria-expanded="false" aria-controls="answerReference">回答を表示</button></div>
<section id="workspace" class="analysis-grid simplified hidden"><details id="answerReference" class="card pane-scroll answer-pane"><summary>回答を閉じる</summary><div class="answer-reference-body"><div class="reference-heading"><h2 id="referenceTitle" class="column-title">見直し後の回答</h2><div class="reference-toggle"><button type="button" data-reference="current" aria-selected="true">見直し後の回答</button><button type="button" data-reference="original" aria-selected="false">最初の回答</button></div></div><div id="original"></div><button id="reviewAnswers" class="secondary" type="button" aria-expanded="false">回答を見直す</button><section id="answerReview" class="hidden"><p id="freshness" class="status"></p><form id="currentForm"><div id="editor"></div><label for="changeReason"><strong>変更理由（任意）</strong></label><textarea id="changeReason" class="memo" maxlength="2000"></textarea><div class="actions"><button id="saveAndAnalyze" type="submit">現在の理解を保存して再分析</button><button id="retryAnalysis" class="secondary hidden" type="button">再分析する</button></div></form></section></div></details><article class="card pane-scroll memo-pane"><h2 class="column-title sticky-heading">テーマ別ヒアリングメモ</h2><div id="records" class="records"></div></article><article id="reportPane" class="card pane-scroll report-pane"><h2 class="column-title">顧客向けレポートを確認・編集</h2><p id="message" class="status hidden" role="status"></p><section id="humanNarrative"></section><section id="generated"></section><details id="analysisDetails" class="supporting-details"><summary>分析詳細を見る</summary><section id="analysis"></section></details></article></section>
</main><script src="/admin/free-diagnosis-v2-common.js"></script><script src="/admin/free-diagnosis-v2-analysis.js"></script></body></html>
