<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SECU:MIE Insight｜リード管理</title><link rel="stylesheet" href="/css/style.css">
<style>
main{max-width:1250px;margin:auto;padding:24px}.head,.actions,.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.head{justify-content:space-between}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.metric{border:1px solid #d6e0e6;border-radius:8px;padding:14px;background:white}.metric strong{display:block;font-size:1.8rem}.filters{margin:16px 0;align-items:end}.filters label{display:flex;flex-direction:column;gap:5px}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #aebac6;border-radius:5px}button{cursor:pointer}button:disabled{opacity:.6}.scroll{overflow:auto}table{width:100%;min-width:920px;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #dbe2e7;vertical-align:top;overflow-wrap:anywhere}th{background:#eef5f3}td:first-child{white-space:nowrap}.hint{color:#526071;font-size:.9rem}dialog{width:min(820px,calc(100% - 24px));max-height:90vh;border:1px solid #ccd5df;border-radius:9px;padding:24px}dialog::backdrop{background:#15253c88}dl{display:grid;grid-template-columns:minmax(125px,170px) 1fr;gap:8px;margin:12px 0}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}dt{font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:#f4f6f9;padding:12px}textarea{width:100%;box-sizing:border-box}#status,#detail-status{min-height:1.4em}[hidden]{display:none!important}@media(max-width:680px){main{padding:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.filters label{width:100%}dl{grid-template-columns:1fr}}
</style></head><body data-service="INSIGHT"><main>
<header class="head"><h1 id="title">SECU:MIE Insight｜リード管理</h1><a href="/admin/">Sales Tools</a></header>
<p class="hint">一般向け無料診断のみ。メールアドレスは未認証です。相談未申込と営業案内への同意は別々に確認してください。</p>
<div class="metrics" aria-label="全期間・テスト案件除外"><div class="metric">診断受付<strong id="received">—</strong></div><div class="metric">診断完了<strong id="completed">—</strong></div><div class="metric">相談申込<strong id="consultations">—</strong></div><div class="metric">営業未対応<strong id="new_leads">—</strong></div></div>
<form id="filters" class="filters"><label>企業名<input name="companyName" maxlength="150"></label><label>診断状況<select name="diagnosisStatus"><option value="">すべて</option><option value="RECEIVED">受付済み</option><option value="COMPLETED">完了</option><option value="FAILED">失敗</option></select></label><label>相談状況<select name="consultationStatus"><option value="">すべて</option><option value="NONE">未申込</option><option value="REQUESTED">申込済み</option></select></label><label>営業状況<select name="salesStatus" id="sales-filter"><option value="">すべて</option></select></label><button type="submit">検索</button></form>
<p id="status" role="status" aria-live="polite"></p>
<div class="scroll"><table><thead><tr><th>受付日時</th><th>企業名・担当者</th><th id="diagnosis-col">診断</th><th>診断状況</th><th>相談状況</th><th>営業状況</th><th>営業案内同意</th><th>詳細</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="actions"><button id="prev" disabled>前の50件</button><span id="page"></span><button id="next" disabled>次の50件</button></div>
<p class="hint">団体向け受付は別画面で管理します。<a href="/admin/pira/">Insight団体向け受付</a></p>
<dialog id="detail"><header class="head"><h2 id="detail-title">リード詳細</h2><button id="close" type="button">閉じる</button></header><h3>企業・連絡先・同意</h3><dl id="contact"></dl><h3>診断結果</h3><dl id="diagnosis"></dl><pre id="result"></pre><h3>相談申込</h3><dl id="consultation"></dl><h3>営業対応</h3><form id="sales-form"><label>営業状況<select id="sales-status"></select></label><p><label for="staff-note">対応メモ</label></p><textarea id="staff-note" rows="4" maxlength="2000"></textarea><button type="submit">保存</button></form><p id="detail-status" role="status"></p></dialog>
<script src="/admin/secumie-general-leads.js" defer></script></main></body></html>
