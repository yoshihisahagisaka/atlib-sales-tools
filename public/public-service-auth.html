<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メールアドレスの確認</title></head>
<body><main>
  <section id="email-screen">
    <h1>メールアドレスの確認</h1>
    <p>本診断を安全にご利用いただくため、メールアドレスによる確認を行っています。</p>
    <p>ご入力いただいたメールアドレスに6桁の認証コードをお送りします。</p>
    <form id="email-form" novalidate><label>メールアドレス<input id="email" type="email" autocomplete="email" required></label><div id="turnstile" aria-label="認証確認"></div><button id="send" type="submit">認証コードを送信する</button></form>
  </section>
  <section id="code-screen" hidden>
    <h1>認証コードの入力</h1><p>メールに届いた6桁の認証コードを入力してください。</p>
    <form id="code-form" novalidate><label>認証コード<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label><button id="verify" type="submit">確認して進む</button></form>
    <button id="resend" type="button" disabled>再送する</button><span id="resend-wait" aria-live="polite"></span><button id="change-email" type="button">メールアドレスを変更する</button>
  </section>
  <section id="success-screen" hidden><h1>メールアドレスの確認が完了しました</h1><button id="start" type="button">診断を開始する</button></section>
  <p id="error" role="alert" aria-live="assertive"></p><p id="busy" role="status" aria-live="polite"></p>
</main><!-- PUBLIC_AUTH_CONFIG --><script src="/public-service-auth.js"></script></body></html>
