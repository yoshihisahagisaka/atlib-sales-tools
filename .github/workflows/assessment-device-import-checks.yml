name: Assessment Device Import Local Checks
on:
  push:
    branches:
      - feat/assessment-device-import-local-preview-20261117
  pull_request:
    paths:
      - 'src/domain/assessmentDeviceImportPreview.ts'
      - 'test/assessmentDeviceImportPreview.test.ts'
      - '.github/workflows/assessment-device-import-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Device CSV preview tests
        run: node -r ts-node/register --test test/assessmentDeviceImportPreview.test.ts
