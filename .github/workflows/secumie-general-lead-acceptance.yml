name: SECU:MIE general lead acceptance
on:
  pull_request:
    branches: [feat/secumie-general-release-20261128, release/secumie-insight-production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 test/secumie_general_staging_bootstrap_test.py
      - run: node --check public/admin/secumie-general-leads.js
      - run: node -r ts-node/register --test test/secumieGeneralAdmin.test.ts test/secumieGeneralLimits.test.ts test/secumieGeneralRuntime.test.ts test/secumieConsultationHandoff.test.ts test/secumieConsultationNotification.test.ts
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable roles and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 55439 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE secumie_general_migration_staging LOGIN PASSWORD 'synthetic-migration-password';
          CREATE ROLE secumie_general_writer_staging LOGIN PASSWORD 'synthetic-writer-password';
          CREATE ROLE secumie_general_staff_staging LOGIN PASSWORD 'synthetic-staff-password';
          CREATE ROLE secumie_general_bootstrap_test LOGIN CREATEDB PASSWORD 'synthetic-bootstrap-password';
          SQL
          PGPASSWORD=synthetic-bootstrap-password psql -h 127.0.0.1 -p 55439 -U secumie_general_bootstrap_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE secumie_general_staging'
          PGPASSWORD=synthetic-bootstrap-password psql -h 127.0.0.1 -p 55439 -U secumie_general_bootstrap_test -d secumie_general_staging -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE CONNECT,TEMPORARY ON DATABASE secumie_general_staging FROM PUBLIC;
          GRANT CONNECT ON DATABASE secumie_general_staging TO secumie_general_migration_staging,secumie_general_writer_staging,secumie_general_staff_staging;
          GRANT CREATE ON DATABASE secumie_general_staging TO secumie_general_migration_staging;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE,CREATE ON SCHEMA public TO secumie_general_migration_staging;
          SQL
      - run: node -r ts-node/register --test test/secumieGeneralLead.postgres.test.ts
        env:
          SECUMIE_GENERAL_ISOLATED_TEST: '1'
          SECUMIE_STAFF_REVIEW_DIR: staff-review-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secumie-general-staff-review
          path: staff-review-evidence/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node -r ts-node/register --test test/secumieGeneral.browser.test.ts
        env:
          SECUMIE_REVIEW_DIR: review-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secumie-general-lead-review
          path: review-evidence/
          retention-days: 7

  production-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact production equivalents in disposable PostgreSQL only
        shell: bash
        run: |
          set -Eeuo pipefail
          export PGPASSWORD=postgres
          psql -X -h 127.0.0.1 -p 55439 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE secumie_general_migration_prod LOGIN NOINHERIT PASSWORD 'synthetic-migration-password' CONNECTION LIMIT 1;
          CREATE ROLE secumie_general_writer_prod LOGIN NOINHERIT PASSWORD 'synthetic-writer-password' CONNECTION LIMIT 4;
          CREATE ROLE secumie_general_staff_prod LOGIN NOINHERIT PASSWORD 'synthetic-staff-password' CONNECTION LIMIT 40;
          CREATE DATABASE secumie_general;
          REVOKE CONNECT,TEMPORARY ON DATABASE secumie_general FROM PUBLIC;
          GRANT CONNECT ON DATABASE secumie_general TO secumie_general_migration_prod,secumie_general_writer_prod,secumie_general_staff_prod;
          GRANT CREATE ON DATABASE secumie_general TO secumie_general_migration_prod;
          SQL
          psql -X -h 127.0.0.1 -p 55439 -U postgres -d secumie_general -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE,CREATE ON SCHEMA public TO secumie_general_migration_prod;
          SQL
          python3 test/secumie_general_production_bootstrap_test.py
          python3 scripts/readiness/secumie_general_production_migrate.py check
          python3 scripts/readiness/secumie_general_production_migrate.py batch > /tmp/general-prod-batch.sql
          export PGPASSWORD=synthetic-migration-password
          if psql -X -h 127.0.0.1 -p 55439 -U secumie_general_migration_prod -d postgres -v ON_ERROR_STOP=1 -f /tmp/general-prod-batch.sql >/tmp/general-wrong-target.log 2>&1; then
            echo 'STOP: wrong database was accepted'; exit 1
          fi
          grep -q GENERAL_MIGRATION_PREFLIGHT_STOP /tmp/general-wrong-target.log
          psql -X -h 127.0.0.1 -p 55439 -U secumie_general_migration_prod -d secumie_general -v ON_ERROR_STOP=1 -f /tmp/general-prod-batch.sql
          python3 scripts/readiness/secumie_general_production_migrate.py verify-sql | psql -X -qAt -h 127.0.0.1 -p 55439 -U secumie_general_migration_prod -d secumie_general -v ON_ERROR_STOP=1 > /tmp/general-prod-evidence.json
          python3 -c 'import json,sys; from pathlib import Path; sys.path.insert(0,"scripts/readiness"); import secumie_general_production_migrate as m; m.verify_result(json.load(open("/tmp/general-prod-evidence.json")),m.production_files(Path("."))); print("PRODUCTION_EQUIVALENT_SQL_ACL=PASS")'
          if psql -X -h 127.0.0.1 -p 55439 -U secumie_general_migration_prod -d secumie_general -v ON_ERROR_STOP=1 -f /tmp/general-prod-batch.sql >/tmp/general-rerun.log 2>&1; then
            echo 'STOP: migration rerun was accepted'; exit 1
          fi
          grep -q GENERAL_MIGRATION_PREFLIGHT_STOP /tmp/general-rerun.log
          echo 'PRODUCTION_MIGRATION_WRONG_TARGET_AND_RERUN_DENIED=PASS'
