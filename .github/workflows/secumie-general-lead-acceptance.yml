name: SECU:MIE general lead acceptance
on:
  pull_request:
    branches: [feat/secumie-general-release-20261128, release/secumie-insight-production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check public/admin/secumie-general-leads.js
      - run: node -r ts-node/register --test test/secumieGeneralAdmin.test.ts test/secumieGeneralLimits.test.ts test/secumieGeneralRuntime.test.ts test/secumieConsultationHandoff.test.ts
