name: WSC mail DNS regression
on:
  pull_request:
    branches: [feat/secumie-general-lead-intake-20261128, feat/secumie-general-release-20261128, release/secumie-insight-production, main]
    paths:
      - 'src/wsc/**'
      - 'test/wscMailDns.test.mjs'
      - 'test/wscDiagnosisAccuracy.test.mjs'
      - 'test/wscPublicDestination.test.mjs'
      - '.github/workflows/wsc-mail-dns-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/wscMailDns.test.mjs test/wscDiagnosisAccuracy.test.mjs test/wscPublicDestination.test.mjs
      - run: |
          node src/wsc/vendor/tools/wsc-vs1/test.mjs
          node src/wsc/vendor/tools/wsc-phase2a/test.mjs
          node src/wsc/vendor/tools/wsc-phase2b/test.mjs
          node src/wsc/vendor/tools/wsc-phase2c/test.mjs
